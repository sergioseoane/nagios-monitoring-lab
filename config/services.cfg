define service {
    use                     generic-service
    host_name               servidor-portfolio
    service_description     Espacio en disco raiz
    check_command           check_local_disk!20%!10%!/
    notes                   Warning si queda menos de 20% libre, critico si queda menos de 10%
    contact_groups          portfolio_admins
}

define service {
    use                     generic-service
    host_name               servidor-portfolio
    service_description     Carga de CPU
    check_command           check_local_load!5.0,4.0,3.0!10.0,6.0,4.0
    notes                   Umbrales pensados para una instancia pequena (1-2 vCPU)
    contact_groups          portfolio_admins
}

define service {
    use                     generic-service
    host_name               servidor-portfolio
    service_description     PostgreSQL - retail_demo
    check_command           check_postgres_connection!$USER10$
    notes                   Vigila que la base de datos del proyecto postgres-retail-admin responde
    contact_groups          portfolio_admins
}

define service {
    use                     generic-service
    host_name               servidor-portfolio
    service_description     Espacio en disco de backups
    check_command           check_local_disk!30%!15%!/home
    notes                   Umbral mas exigente en la carpeta de backups: si se llena, los backups empiezan a fallar antes que el resto del sistema
    contact_groups          portfolio_admins
}
